<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Photo placeholder</title>
  <desc id="desc">Blue placeholder block for a future Care Loft photograph.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf5fb"/>
      <stop offset=".55" stop-color="#d8e8f3"/>
      <stop offset="1" stop-color="#dfbc8d"/>
    </linearGradient>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0v52" fill="none" stroke="#466b56" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#grid)"/>
  <rect x="86" y="86" width="1028" height="728" rx="18" fill="none" stroke="#466b56" stroke-opacity=".32" stroke-width="2" stroke-dasharray="18 16"/>
  <g fill="none" stroke="#466b56" stroke-linecap="round" stroke-linejoin="round" stroke-width="18" opacity=".72">
    <rect x="470" y="300" width="260" height="210" rx="18"/>
    <path d="m505 500 72-78 55 56 38-35 46 57"/>
    <circle cx="664" cy="357" r="24"/>
  </g>
  <text x="600" y="610" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" letter-spacing="8" fill="#345440">PHOTO PLACEHOLDER</text>
</svg>
